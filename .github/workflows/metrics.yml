name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metrics embed
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Juuwuwmyr
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC

          # 🟢 ETO ANG MAG-EENABLE NG ISOMETRIC CALENDAR:
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
